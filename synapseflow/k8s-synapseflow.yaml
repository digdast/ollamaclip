apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapseflow
  namespace: ai
  labels:
    app: synapseflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapseflow
  template:
    metadata:
      labels:
        app: synapseflow
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-cp-03
      volumes:
      - name: synapseflow-storage
        hostPath:
          path: /data/appdata/synapseflow
          type: DirectoryOrCreate
      initContainers:
      - name: init-permissions
        image: busybox:latest
        command: ["sh", "-c", "mkdir -p /data/appdata/synapseflow/data /data/appdata/synapseflow/templates && chmod -R 777 /data/appdata/synapseflow"]
        volumeMounts:
        - name: synapseflow-storage
          mountPath: /data/appdata/synapseflow
      containers:
      - name: synapseflow
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install --no-cache-dir fastapi uvicorn pydantic &&
          python /app/synapseflow_server.py
        env:
        - name: OLLAMA_URL
          value: "http://192.168.0.17:11434"
        - name: HERMES_URL
          value: "http://hermes.ai.svc.cluster.local:7892"
        - name: PAPERCLIP_URL
          value: "http://paperclip.ai.svc.cluster.local:7891"
        - name: SYNAPSE_PORT
          value: "7895"
        ports:
        - name: http
          containerPort: 7895
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        volumeMounts:
        - name: synapseflow-storage
          mountPath: /app
---
apiVersion: v1
kind: Service
metadata:
  name: synapseflow
  namespace: ai
  labels:
    app: synapseflow
spec:
  type: NodePort
  selector:
    app: synapseflow
  ports:
  - name: http
    port: 7895
    targetPort: 7895
    nodePort: 30795
