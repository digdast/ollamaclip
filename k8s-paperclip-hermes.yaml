---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperclip-hermes-ingress
  namespace: ai
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: paperclip.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paperclip
            port:
              number: 7891
  - host: paperclip.ertechlab.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paperclip
            port:
              number: 7891
  - host: hermes.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes
            port:
              number: 7892
  - host: hermes.ertechlab.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes
            port:
              number: 7892
  - host: claude.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: claude
            port:
              number: 7893
  - host: claude.ertechlab.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: claude
            port:
              number: 7893
