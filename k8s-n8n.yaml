apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: ai
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-cp-03
      initContainers:
      - name: init-permissions
        image: busybox:latest
        command: ["sh", "-c", "mkdir -p /home/node/.n8n && chown -R 1000:1000 /home/node/.n8n"]
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5678
        env:
        - name: N8N_HOST
          value: "0.0.0.0"
        - name: N8N_PORT
          value: "5678"
        - name: N8N_LISTEN_ADDRESS
          value: "0.0.0.0"
        - name: N8N_PROTOCOL
          value: "http"
        - name: N8N_SECURE_COOKIE
          value: "false"
        - name: WEBHOOK_URL
          value: "http://192.168.0.81:30678/"
        - name: OLLAMA_HOST
          value: "http://192.168.0.17:11434"
        - name: OLLAMA_URL
          value: "http://192.168.0.17:11434"
        - name: PAPERCLIP_URL
          value: "http://paperclip.ai.svc.cluster.local:7891"
        - name: HERMES_URL
          value: "http://hermes.ai.svc.cluster.local:7892"
        - name: NODE_FUNCTION_ALLOW_BUILTIN
          value: "*"
        - name: NODE_FUNCTION_ALLOW_EXTERNAL
          value: "*"
        - name: N8N_DEFAULT_BINARY_DATA_MODE
          value: "filesystem"
        - name: EXECUTIONS_DATA_PRUNE
          value: "true"
        - name: EXECUTIONS_DATA_MAX_AGE
          value: "168"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-storage
        hostPath:
          path: /var/lib/n8n-data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: ai
  labels:
    app: n8n
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
  - name: http
    port: 5678
    targetPort: 5678
    nodePort: 30678
